# Windows shard 2 remainder: bunfig.win2.parallel.toml plus the rpc-host suite, which Windows runs
# in its own invocation through script/bun-panic-retry.ts because Bun intermittently segfaults a test
# worker there (oven-sh/bun#44390, #9219). Keep every other pattern identical to
# bunfig.win2.parallel.toml.
[test]
preload = ["./test-env.ts", "./test-setup.ts"]
pathIgnorePatterns = [
  "dist/**",
  "packages/lsp-tools-mcp/**",
  "packages/lsp-daemon/**",
  "packages/shared-skills/upstreams/**",
  "packages/omo-opencode/**",
  "packages/memory-core/**",
  "packages/shared-skills/provenance-gate.test.ts",
  "script/release-version.test.ts",
]

[loader]
".md" = "text"
